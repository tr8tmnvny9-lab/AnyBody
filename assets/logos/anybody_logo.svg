  <!-- Brand Title & Subtitle -->
  <text x="284" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="#0F172A">AnyBody</text>
  <rect x="470" y="36" width="414" height="36" rx="18" fill="#EFF6FF" stroke="#0082FB" stroke-width="1.5" />
  <text x="490" y="59" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="14" fill="#0064E0">25.11M SYNAPSES · 1,000 Hz · ZERO PID</text>
