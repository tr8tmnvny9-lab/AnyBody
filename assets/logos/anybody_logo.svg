<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="920" height="140">
  <defs>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="50%" stop-color="#0082FB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0064E0" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="6" y="6" width="908" height="128" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#softShadow)" />
